services:
  - type: web
    name: microscope-specimen-calculator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: MICROSCOPE_DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: microscope-data
      mountPath: /var/data
      sizeGB: 1
